<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>𝒏𝒂𝒅𝒂 ❤️</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      overflow-x: hidden;
      background: #fff;
    }

    /* الصفحة الأولى */
    #loginPage {
      min-height: 100vh;
      min-height: 100svh;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      position: relative;
      overflow: hidden;
    }

    .login-box {
      width: min(420px, 92vw);
      text-align: center;
      position: relative;
      z-index: 2;
      animation: appear .9s ease;
    }

    .login-heart {
      font-size: 58px;
      margin-bottom: 8px;
      animation: heartbeat 1.6s infinite;
    }

    .login-title {
      color: #111;
      font-size: 25px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .login-sub {
      color: #e21b35;
      font-size: 17px;
      margin: 0 0 24px;
    }

    #password {
      width: 100%;
      height: 56px;
      border: 2px solid #eee;
      border-radius: 18px;
      outline: none;
      text-align: center;
      font-size: 20px;
      background: #fff;
      color: #111;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      transition: .25s;
    }

    #password:focus {
      border-color: #e21b35;
      box-shadow: 0 8px 30px rgba(226,27,53,.15);
    }

    .enter-btn {
      margin-top: 14px;
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 17px;
      background: #e21b35;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(226,27,53,.25);
      transition: transform .2s, box-shadow .2s;
    }

    .enter-btn:active { transform: scale(.97); }

    #error {
      min-height: 25px;
      color: #e21b35;
      margin-top: 12px;
      font-size: 14px;
    }

    /* القلوب الساقطة */
    .falling-heart {
      position: absolute;
      top: -50px;
      color: #e21b35;
      user-select: none;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 1;
    }

    @keyframes fall {
      to { transform: translateY(115vh) rotate(360deg); opacity: 0; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* الصفحة الثانية */
    #lovePage {
      display: none;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 5%, rgba(150,0,25,.16), transparent 30%),
        #050505;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 20px;
      background: rgba(5,5,5,.72);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .name {
      direction: ltr;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 16px rgba(255,40,70,.35);
    }

    .love-wrap {
      width: min(700px, 92vw);
      margin: 0 auto;
      padding: 45px 0 60px;
      text-align: center;
    }

    .intro {
      font-size: 16px;
      color: #aaa;
      margin: 0 0 28px;
      animation: appear 1s ease;
    }

    .main-heart {
      width: 170px;
      height: 170px;
      margin: 0 auto 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 76px;
      background: radial-gradient(circle, rgba(225,20,55,.24), rgba(225,20,55,.03) 70%);
      box-shadow: 0 0 70px rgba(225,20,55,.12);
      animation: heartbeat 2s infinite;
    }

    .card {
      background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 24px;
      padding: 22px;
      margin: 18px 0;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
    }

    .card-btn {
      width: 100%;
      border: 0;
      border-radius: 17px;
      padding: 17px 15px;
      background: #e21b35;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(226,27,53,.18);
      transition: .2s;
    }

    .card-btn:active { transform: scale(.98); }

    .hidden-content {
      display: none;
      margin-top: 20px;
      animation: reveal .6s ease;
    }

    .hidden-content.show { display: block; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .date {
      font-size: 27px;
      color: #ff4960;
      font-weight: 800;
      direction: ltr;
      text-shadow: 0 0 20px rgba(255,73,96,.18);
    }

    .photo {
      width: 100%;
      max-height: 620px;
      object-fit: contain;
      border-radius: 20px;
      display: block;
      background: #000;
      border: 1px solid rgba(255,255,255,.08);
    }

    .eyes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .eye-box {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
    }

    .eye-box img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .eye-label {
      padding: 10px 5px;
      color: #ddd;
      font-size: 13px;
    }

    .final-message {
      margin-top: 45px;
      padding: 35px 15px 20px;
      font-size: clamp(26px, 7vw, 42px);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 25px rgba(255,30,60,.25);
      animation: heartbeat 2.5s infinite;
    }

    .mini-hearts {
      color: #e21b35;
      letter-spacing: 7px;
      font-size: 17px;
      margin-top: 12px;
    }

    .page-heart {
      position: fixed;
      top: -30px;
      color: rgba(226,27,53,.32);
      pointer-events: none;
      z-index: 0;
      animation: fall linear forwards;
    }

    @media (max-width: 520px) {
      .love-wrap { padding-top: 30px; }
      .main-heart { width: 140px; height: 140px; font-size: 62px; }
      .eyes { gap: 8px; }
      .eye-box img { height: 170px; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- الصفحة الأولى -->
  <section id="loginPage">
    <div class="login-box">
      <div class="login-heart">❤️</div>
      <h1 class="login-title">موقع ندى ❤️</h1>
      <p class="login-sub">اكتبي الباسوورد يا قلبي 😍</p>

      <input id="password" type="password" placeholder="اكتبي الباسوورد هنا" autocomplete="off">
      <button class="enter-btn" onclick="checkPassword()">دخول ❤️</button>
      <div id="error"></div>
    </div>
  </section>

  <!-- الصفحة الثانية -->
  <section id="lovePage">
    <header class="topbar">
      <div class="name">𝒏𝒂𝒅𝒂</div>
    </header>

    <main class="love-wrap">
      <p class="intro">حاجات صغيرة معمولالك مخصوص ❤️</p>

      <div class="main-heart">❤️</div>

      <div class="card">
        <button class="card-btn" onclick="toggleContent('day')">
          أحلى يوم في حياتي 😍
        </button>
        <div id="day" class="hidden-content">
          <div class="date">11/9/2026 😍🫂</div>
        </div>
      </div>

      <div class="card">
        <button class="card-btn" onclick="toggleContent('moon')">
          تعالي أوريكي القمر 🌚
        </button>
        <div id="moon" class="hidden-content">
          <img class="photo" src="nada.jpg" alt="ندى">
        </div>
      </div>

      <div class="card">
        <button class="card-btn" onclick="toggleContent('eyes')">
          أحلى عينين 😍
        </button>
        <div id="eyes" class="hidden-content">
          <div class="eyes">
            <div class="eye-box">
              <img src="my-eye.jpg" alt="عيني">
              <div class="eye-label">عيني ❤️</div>
            </div>
            <div class="eye-box">
              <img src="nada-eye.jpg" alt="عينيها">
              <div class="eye-label">عينيها ❤️</div>
            </div>
          </div>
        </div>
      </div>

      <div class="final-message">
        بحبك ي نور عيني ♥️💋
        <div class="mini-hearts">♥ ♥ ♥</div>
      </div>
    </main>
  </section>

  <script>
    const correctPassword = "10/11/2009";

    function checkPassword() {
      const input = document.getElementById("password");
      const error = document.getElementById("error");

      if (input.value === correctPassword) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("lovePage").style.display = "block";
        window.scrollTo(0, 0);
        startPageHearts();
      } else {
        error.textContent = "الباسوورد مش صح يا قلبي 😭❤️";
        input.animate(
          [
            { transform: "translateX(0)" },
            { transform: "translateX(-8px)" },
            { transform: "translateX(8px)" },
            { transform: "translateX(0)" }
          ],
          { duration: 300 }
        );
      }
    }

    document.getElementById("password").addEventListener("keydown", function(e) {
      if (e.key === "Enter") checkPassword();
    });

    function toggleContent(id) {
      const el = document.getElementById(id);
      el.classList.toggle("show");
      if (el.classList.contains("show")) {
        setTimeout(() => {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 80);
      }
    }

    function makeHeart(parent, className, minSize, maxSize, minDuration, maxDuration) {
      const h = document.createElement("span");
      h.className = className;
      h.textContent = "♥";
      h.style.left = Math.random() * 100 + "%";
      h.style.fontSize = (minSize + Math.random() * (maxSize - minSize)) + "px";
      h.style.animationDuration = (minDuration + Math.random() * (maxDuration - minDuration)) + "s";
      h.style.opacity = (0.35 + Math.random() * 0.6).toFixed(2);
      parent.appendChild(h);
      setTimeout(() => h.remove(), (maxDuration + 1) * 1000);
    }

    setInterval(() => {
      makeHeart(document.getElementById("loginPage"), "falling-heart", 9, 20, 5, 9);
    }, 380);

    function startPageHearts() {
      setInterval(() => {
        makeHeart(document.getElementById("lovePage"), "page-heart", 8, 18, 6, 10);
      }, 600);
    }
  </script>
</body>
</html>
